{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openclaw.fullname" . }}-gateway-config
  labels:
    {{- include "openclaw.gateway.labels" . | nindent 4 }}
data:
  openclaw.json: |
    {
      "gateway": {
        "bind": {{ .Values.gateway.bind | quote }},
        "controlUi": {
          "enabled": {{ .Values.gateway.controlUi.enabled }},
          "allowedOrigins": {{ .Values.gateway.controlUi.allowedOrigins | toJson }}
        },
        "auth": {
          "mode": {{ .Values.gateway.auth.mode | quote }},
          "token": "${OPENCLAW_GATEWAY_TOKEN}"
        }
      }
    }
{{- end }}
