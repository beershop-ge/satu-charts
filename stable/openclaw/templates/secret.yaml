{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openclaw.fullname" . }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.secrets.gatewayToken | quote }}
  CLAUDE_AI_SESSION_KEY: {{ .Values.secrets.claudeAiSessionKey | quote }}
  CLAUDE_WEB_SESSION_KEY: {{ .Values.secrets.claudeWebSessionKey | quote }}
  CLAUDE_WEB_COOKIE: {{ .Values.secrets.claudeWebCookie | quote }}
{{- end }}
