{{- /* Backend JWT secret: generate once, reuse on upgrades */ -}}
{{- $secretName := printf "%s-backend-secret" (include "kitchenowl.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $jwt := "" -}}
{{- if $existing -}}
  {{- if hasKey $existing.data "JWT_SECRET_KEY" -}}
    {{- $jwt = index $existing.data "JWT_SECRET_KEY" -}}
  {{- else -}}
    {{- $jwt = (randAlphaNum 32 | b64enc) -}}
  {{- end -}}
{{- else -}}
  {{- $jwt = (randAlphaNum 32 | b64enc) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "kitchenowl.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET_KEY: {{ $jwt }}
