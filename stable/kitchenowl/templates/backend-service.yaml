apiVersion: v1
kind: Service
metadata:
  name: {{ include "kitchenowl.fullname" . }}-backend
  labels:
    {{- include "kitchenowl.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: "backend"
    {{- include "kitchenowl.selectorLabels" . | nindent 4 }}
