apiVersion: v1
kind: Service
metadata:
  name: {{ include "kitchenowl.fullname" . }}-web
  labels:
    app.kubernetes.io/component: "web"
    {{- include "kitchenowl.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if or .Values.monitoring.enabled .Values.monitoring.servicemonitor.enabled }}
    - port: 9100
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    app.kubernetes.io/component: "web"
    {{- include "kitchenowl.selectorLabels" . | nindent 4 }}
