image:
  repository: gameservermanagers/gameserver
  tag: cs2
  pullPolicy: IfNotPresent

game:
  type: csgoserver
  serverName: "My LGSM Server"
  updateOnStart: true
  extraEnv: []

ports:
  - name: game-udp
    port: 27015
    containerPort: 27015
    protocol: UDP
  - name: query-udp
    port: 27016
    containerPort: 27016
    protocol: UDP
  - name: rcon-tcp
    port: 27015
    containerPort: 27015
    protocol: TCP

service:
  type: LoadBalancer
  annotations: {}
  externalTrafficPolicy: Cluster

persistence:
  enabled: true
  mountPath: /data
  size: 20Gi
  accessModes:
    - ReadWriteOnce
  storageClass: ""

resources: {}

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}

livenessProbe:
  enabled: false
readinessProbe:
  enabled: false
